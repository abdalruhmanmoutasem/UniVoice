{% extends "base.html" %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>Staff accounts</h1></div></div>
<div class="panel"><h2>Create staff account</h2><form method="post"><label>Full name<input name="full_name" required></label><label>Email<input type="email" name="email" required></label><label>Temporary password<input type="password" name="password" minlength="8" required></label><label>Department<select name="department_id" required>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></label><button>Create staff account</button></form></div>
<div class="panel"><h2>Existing staff</h2><table><tr><th>Name</th><th>Email</th><th>Department</th></tr>{% for person in staff %}<tr><td>{{ person.full_name }}</td><td>{{ person.email }}</td><td>{{ person.department.name if person.department else '-' }}</td></tr>{% endfor %}</table></div>
{% endblock %}
