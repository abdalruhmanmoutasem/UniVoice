{% extends "base.html" %}{% block content %}
<p class="eyebrow">STAFF PORTAL</p><h1>Assigned requests</h1><div class="panel"><table><thead><tr><th>Code</th><th>Title</th><th>Student</th><th>Status</th><th></th></tr></thead><tbody>{% for item in requests %}<tr><td>{{ item.ticket_code }}</td><td>{{ item.title }}</td><td>{{ item.student.full_name }}</td><td>{{ item.status }}</td><td><a href="{{ url_for('staff.request_detail', request_id=item.id) }}">Open</a></td></tr>{% else %}<tr><td colspan="5">No requests assigned to you.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
